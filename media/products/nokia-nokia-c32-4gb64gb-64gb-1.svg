<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620">
  <defs>
    <radialGradient id="backdrop-NokiaNokiaC32PearlWhitef" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f1f2f5"/>
      <stop offset="100%" stop-color="#e2e4e9"/>
    </radialGradient>
    <linearGradient id="body-NokiaNokiaC32PearlWhitef" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#a6a6a3"/>
    </linearGradient>
    <linearGradient id="sheen-NokiaNokiaC32PearlWhitef" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="28%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen-NokiaNokiaC32PearlWhitef" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6a6a3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <radialGradient id="shadow-NokiaNokiaC32PearlWhitef" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="620" fill="url(#backdrop-NokiaNokiaC32PearlWhitef)"/>
  <ellipse cx="250" cy="572" rx="130" ry="20" fill="url(#shadow-NokiaNokiaC32PearlWhitef)"/>

  <!-- phone body -->
  <rect x="128" y="46" width="244" height="500" rx="46" ry="46" fill="url(#body-NokiaNokiaC32PearlWhitef)" stroke="#00000014" stroke-width="1.5"/>
  <rect x="128" y="46" width="244" height="500" rx="46" ry="46" fill="url(#sheen-NokiaNokiaC32PearlWhitef)"/>

  <!-- side buttons -->
  <rect x="124" y="150" width="5" height="34" rx="2.5" fill="#00000030"/>
  <rect x="124" y="196" width="5" height="60" rx="2.5" fill="#00000030"/>
  <rect x="371" y="168" width="5" height="76" rx="2.5" fill="#00000030"/>

  <!-- screen -->
  <rect x="142" y="64" width="216" height="464" rx="32" ry="32" fill="url(#screen-NokiaNokiaC32PearlWhitef)"/>

  <!-- dynamic island / notch -->
  <rect x="216" y="80" width="68" height="20" rx="10" fill="#000000"/>
  <circle cx="266" cy="90" r="3" fill="#1c2733"/>

  <!-- status bar -->
  <text x="164" y="112" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="600">9:41</text>
  <g fill="#ffffff">
    <rect x="316" y="104" width="3" height="8" rx="1"/>
    <rect x="321" y="101" width="3" height="11" rx="1"/>
    <rect x="326" y="98" width="3" height="14" rx="1"/>
    <rect x="333" y="100" width="18" height="10" rx="2.5" fill="none" stroke="#ffffff" stroke-width="1.4"/>
    <rect x="335" y="102" width="12" height="6" rx="1.2"/>
  </g>

  <!-- lock screen clock -->
  <text x="250" y="230" font-family="'Poppins', Arial, sans-serif" font-size="46" fill="#ffffff" text-anchor="middle" font-weight="600" opacity="0.96">10:24</text>
  <text x="250" y="256" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" opacity="0.7">Nokia Nokia C32</text>

  <!-- wallpaper accent shapes -->
  <circle cx="250" cy="360" r="70" fill="#f5f5f0" opacity="0.35"/>
  <circle cx="250" cy="360" r="46" fill="#ffffff" opacity="0.4"/>

  <!-- home indicator -->
  <rect x="222" y="500" width="56" height="5" rx="2.5" fill="#ffffff" opacity="0.55"/>

  <!-- caption -->
  <text x="250" y="600" font-family="Arial, sans-serif" font-size="17" fill="#232326" text-anchor="middle" font-weight="600">Nokia Nokia C32</text>
  <text x="250" y="617" font-family="Arial, sans-serif" font-size="12.5" fill="#7a7a80" text-anchor="middle">Pearl White</text>
</svg>