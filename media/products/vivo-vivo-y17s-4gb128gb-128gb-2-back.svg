<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620">
  <defs>
    <radialGradient id="backdropb-VivoVivoY17sMidnightBlac" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eef0f3"/>
      <stop offset="100%" stop-color="#dfe2e7"/>
    </radialGradient>
    <linearGradient id="bodyb-VivoVivoY17sMidnightBlac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131314"/>
      <stop offset="45%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#252528"/>
    </linearGradient>
    <linearGradient id="sheenb-VivoVivoY17sMidnightBlac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lens-VivoVivoY17sMidnightBlac" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5a5f6b"/>
      <stop offset="55%" stop-color="#15161a"/>
