    </radialGradient>
    <radialGradient id="shadowb-VivoVivoY17sMidnightBlac" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="620" fill="url(#backdropb-VivoVivoY17sMidnightBlac)"/>
  <ellipse cx="250" cy="572" rx="130" ry="20" fill="url(#shadowb-VivoVivoY17sMidnightBlac)"/>

  <!-- phone body -->
  <rect x="128" y="46" width="244" height="500" rx="46" ry="46" fill="url(#bodyb-VivoVivoY17sMidnightBlac)" stroke="#00000014" stroke-width="1.5"/>
  <rect x="128" y="46" width="244" height="500" rx="46" ry="46" fill="url(#sheenb-VivoVivoY17sMidnightBlac)"/>

  <!-- camera module -->
  <rect x="158" y="80" width="118" height="118" rx="30" fill="#00000022"/>
  <rect x="158" y="80" width="118" height="118" rx="30" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

  <circle cx="196" cy="118" r="24" fill="url(#lens-VivoVivoY17sMidnightBlac)"/>
  <circle cx="196" cy="118" r="24" fill="none" stroke="#00000055" stroke-width="2"/>
  <circle cx="188" cy="110" r="5" fill="#ffffff" opacity="0.5"/>

  <circle cx="240" cy="118" r="24" fill="url(#lens-VivoVivoY17sMidnightBlac)"/>
  <circle cx="240" cy="118" r="24" fill="none" stroke="#00000055" stroke-width="2"/>
  <circle cx="232" cy="110" r="5" fill="#ffffff" opacity="0.5"/>

  <circle cx="196" cy="162" r="18" fill="url(#lens-VivoVivoY17sMidnightBlac)"/>
  <circle cx="196" cy="162" r="18" fill="none" stroke="#00000055" stroke-width="2"/>
  <circle cx="190" cy="156" r="3.6" fill="#ffffff" opacity="0.5"/>

  <rect x="228" y="150" width="26" height="12" rx="4" fill="#0c0c0e"/>
  <rect x="228" y="150" width="26" height="12" rx="4" fill="none" stroke="#ffffff" stroke-opacity="0.15"/>

  <!-- brand wordmark, subtly etched -->
  <text x="250" y="420" font-family="'Poppins', Arial, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.5" text-anchor="middle" font-weight="600" letter-spacing="1">Vivo</text>
  <text x="250" y="444" font-family="Arial, sans-serif" font-size="10" fill="#ffffff" fill-opacity="0.35" text-anchor="middle" letter-spacing="2">5G</text>

  <!-- caption -->
  <text x="250" y="600" font-family="Arial, sans-serif" font-size="17" fill="#232326" text-anchor="middle" font-weight="600">Vivo Vivo Y17s</text>
  <text x="250" y="617" font-family="Arial, sans-serif" font-size="12.5" fill="#7a7a80" text-anchor="middle">Midnight Black &#183; Back View</text>
