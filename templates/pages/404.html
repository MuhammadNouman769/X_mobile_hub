{% extends 'base.html' %}
{% block title %}Page Not Found — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container-narrow container py-5 text-center">
  <h1 class="display-4 fw-bold text-accent">404</h1>
  <h2 class="h4 mb-3">This page seems to have wandered off.</h2>
  <p class="text-muted">The page you're looking for doesn't exist or may have moved.</p>
  <a href="{% url 'pages:home' %}" class="btn btn-accent mt-3">Back to Home</a>
</div>
{% endblock %}
