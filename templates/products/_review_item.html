{% load shop_extras %}
<div class="border-bottom py-3">
  <div class="d-flex justify-content-between">
    <strong class="small">{{ review.user.get_full_name|default:review.user.username }}</strong>
    <span class="text-muted small">{{ review.created_at|date:"d M Y" }}</span>
  </div>
  <div class="rating-stars my-1">
    {% for i in review.rating|star_range %}<i class="bi bi-star-fill"></i>{% endfor %}
    {% for i in review.rating|empty_star_range %}<i class="bi bi-star"></i>{% endfor %}
  </div>
  <p class="mb-0 small text-muted">{{ review.comment }}</p>
</div>
