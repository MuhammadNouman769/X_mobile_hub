{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Login — XMobile Hub</title>
<link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{% static 'css/style.css' %}" rel="stylesheet">
<style>body{background:#171719;min-height:100vh;display:flex;align-items:center;font-family:var(--font-body);}</style>
</head>
<body>
<div class="container" style="max-width:420px;">
  <div class="bg-white rounded-4 p-4 p-md-5 shadow">
    <div class="text-center mb-4">
      <img src="{% static 'img/logo.svg' %}" alt="XMobile Hub" style="height:38px;">
      <p class="text-muted small mt-2 mb-0">Staff Dashboard</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small">Username</label>
        {{ form.username }}
      </div>
      <div class="mb-3">
        <label class="form-label small">Password</label>
        {{ form.password }}
      </div>
      {% if form.non_field_errors %}<div class="text-danger small mb-3">{{ form.non_field_errors }}</div>{% endif %}
      <button type="submit" class="btn btn-accent w-100">Login to Dashboard</button>
    </form>
    <p class="text-center text-muted small mt-4 mb-0">Default seed credentials: <strong>admin / admin12345</strong></p>
  </div>
</div>
</body>
</html>
